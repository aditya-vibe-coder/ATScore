<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="dot1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dot2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Score gauge visualization -->
  <g transform="translate(60, 60)">
    <!-- Gauge arc background -->
    <path d="M 200 250 A 180 180 0 0 0 560 250" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
    <!-- Gauge arc filled -->
    <path d="M 200 250 A 180 180 0 0 0 460 250" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-dasharray="283 565"/>
    <!-- Score text -->
    <text x="380" y="90" font-family="Arial,sans-serif" font-size="72" font-weight="bold" fill="#f97316" text-anchor="middle">78</text>
    <text x="380" y="120" font-family="Arial,sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">/ 100 — ATS Score</text>
  </g>

  <!-- Title and subtitle -->
  <text x="620" y="100" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#f8fafc">ATScore India</text>
  <text x="620" y="145" font-family="Arial,sans-serif" font-size="22" fill="#94a3b8">ATS Resume Scorer for Indian Jobs</text>

  <!-- Track badges -->
  <g transform="translate(620, 180)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="24" font-family="Arial,sans-serif" font-size="14" fill="#f97316" text-anchor="middle">→ Mass Hiring Track</text>
    <rect x="0" y="46" width="200" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="70" font-family="Arial,sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">→ Naukri.com Index Track</text>
    <rect x="0" y="92" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="116" font-family="Arial,sans-serif" font-size="14" fill="#a855f7" text-anchor="middle">→ FAANG India Track</text>
    <rect x="0" y="138" width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="162" font-family="Arial,sans-serif" font-size="14" fill="#10b981" text-anchor="middle">→ Indian Startups Track</text>
    <rect x="0" y="184" width="230" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="115" y="208" font-family="Arial,sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle">→ LinkedIn / Consulting MNC Track</text>
  </g>

  <!-- Feature columns -->
  <g transform="translate(620, 260)">
    <text x="0" y="20" font-family="Arial,sans-serif" font-size="16" fill="#f97316" font-weight="bold">100-Point Scoring</text>
    <text x="0" y="44" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">Format • Sections • Keywords</text>
    <text x="0" y="64" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">India Intelligence • Track Bonus</text>
  </g>

  <g transform="translate(620, 350)">
    <text x="0" y="20" font-family="Arial,sans-serif" font-size="16" fill="#3b82f6" font-weight="bold">Premium AI Suite</text>
    <text x="0" y="44" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">STAR Rewrites • Interview Prep</text>
    <text x="0" y="64" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">Keyword Injector • JD Sandbox</text>
  </g>

  <!-- Score buckets visualization (right side) -->
  <g transform="translate(620, 420)">
    <!-- Bucket bars -->
    <text x="0" y="16" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Format</text>
    <rect x="60" y="4" width="80" height="14" rx="7" fill="#334155"/>
    <rect x="60" y="4" width="60" height="14" rx="7" fill="#f97316"/>

    <text x="0" y="40" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Sections</text>
    <rect x="60" y="28" width="80" height="14" rx="7" fill="#334155"/>
    <rect x="60" y="28" width="52" height="14" rx="7" fill="#f97316"/>

    <text x="0" y="64" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Keywords</text>
    <rect x="60" y="52" width="80" height="14" rx="7" fill="#334155"/>
    <rect x="60" y="52" width="44" height="14" rx="7" fill="#f97316"/>

    <text x="0" y="88" font-family="Arial,sans-serif" font-size="12" fill="#64748b">India</text>
    <rect x="60" y="76" width="80" height="14" rx="7" fill="#334155"/>
    <rect x="60" y="76" width="68" height="14" rx="7" fill="#f97316"/>
  </g>

  <!-- Footer -->
  <text x="600" y="590" font-family="Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">atscore.harmnix.com — Free ATS Resume Checker for the Indian Hiring Ecosystem</text>
</svg>
